name: Platform checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bioskills
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: bioskills
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bioskills"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          cp .env.example .env
          echo 'DATABASE_URL=postgres://bioskills:test-only-ci-password@localhost:5432/bioskills' >> .env
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
        env:
          APP_ORIGIN: http://localhost:3004
          REHEARSAL_DB_PORT: '5432'
      - run: npm run test:browser
        env:
          APP_ORIGIN: http://localhost:3004
          REHEARSAL_DB_PORT: '5432'
          REHEARSAL_BROWSER: webkit
          REHEARSAL_MOBILE_ONLY: 'true'
      - run: npm run test:load
        env:
          APP_ORIGIN: http://localhost:3004
          REHEARSAL_DB_PORT: '5432'
