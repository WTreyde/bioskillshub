services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bioskills
      POSTGRES_DB: bioskills
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${DB_PORT:-5438}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioskills"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://bioskills:${POSTGRES_PASSWORD}@db:5432/bioskills
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
